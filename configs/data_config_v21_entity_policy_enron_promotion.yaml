    target_unit: sources
    KB_Member: 1000
    True_Non_Member: 1000
    Spoof_Seed: 0
    Reserve: 250
    per_source_cap: null
datasets:
  enron:
    input_path: artifacts/v21/enron_full/sampling/enron_screening_pool_150000.jsonl
    limit: null
    source_limit: null
    source_eligibility_path: artifacts/v21/entity_policy_r2/enron_capacity_promotion/enron_capacity_qualified_primary_manifest.json
    membership_unit: complete_email
