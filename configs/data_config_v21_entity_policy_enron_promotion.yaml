logging:
  level: INFO
  file: artifacts/v21/formal_entity_policy_r2/logs/enron_promotion.log
paths:
  processed_dir: artifacts/v21/enron_full/processed
  splits_dir: artifacts/v21/formal_entity_policy_r2/splits
