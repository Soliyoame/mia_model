# PCV-MIA data configuration.

logging:
  level: INFO
  file: datasets/logs/preprocess.log

paths:
  processed_dir: datasets/processed
  splits_dir: datasets/splits

preprocess:
  min_chars: 300
  max_chars: 2000
  target_chars: 1000
  require_entity: true
  require_numeric: false
  # PCV-MIA paired claims need replaceable entities.
  min_entities: 2

split:
  seed: 42
  source_exclusive: true
  scale: small
  small:
    # small 为探路规模,沿用旧切分(不设 per_source_cap),保持既有 edgar small 产物可复现。
    KB_Member: 100
    True_Non_Member: 100
    Spoof_Seed: 100
    Reserve: 100
    per_source_cap: 3
  # formal:按「独立原始文档数」而非 chunk 数设计。per_source_cap 限制每篇原始文档最多贡献的
  # chunk 数,逼迫覆盖更多文档 → 有效独立样本数 ≈ 目标数 / per_source_cap。
  # 例:KB 600 / cap 3 ≈ 200 篇独立文档;TN 同理(负类 n≈200,TPR@1%FPR 才取得到);Reserve 150 篇。
  # Spoof_Seed 置 0(当前未使用 Spoofed 对照);若下游第 04 步不容忍空输入,设回小值即可。
  formal:
    KB_Member: 600
    True_Non_Member: 600
    Spoof_Seed: 0
    Reserve: 450
    per_source_cap: 3

datasets:
  enron:
    input_path: datasets/raw/extracted/enron
    limit: 30000
  cuad:
    input_path: datasets/raw/extracted/cuad/CUAD_v1/CUAD_v1.json
    limit: 3000
  edgar:
    input_path: datasets/raw/extracted/edgar/raw.jsonl
    limit: 50000
  pubmed:
    input_path: datasets/raw/extracted/pmc/raw.jsonl
    limit: 50000
