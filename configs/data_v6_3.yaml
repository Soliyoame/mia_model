# Isolated data configuration for the v6.3 precision-cascade protocol.
# This file is not the active canonical configuration until all v6.3 gates pass.

logging:
  level: INFO
  file: artifacts/v6_3/logs/preprocess.log

paths:
  processed_dir: artifacts/v6_3/processed
  splits_dir: artifacts/v6_3/splits
  benchmark_dir: artifacts/v6_3/benchmarks

dataset_paths:
  edgar:
    splits_dir: artifacts/v6_3/splits/edgar
  enron:
    splits_dir: artifacts/v6_3/splits/enron
  pubmed:
    splits_dir: artifacts/v6_3/splits/pubmed

preprocess:
  min_chars: 300
  max_chars: 2000
  target_chars: 1000
  require_entity: true
  require_numeric: false
  min_entities: 2

split:
  seed: 42
  source_exclusive: true
  scale: formal
  small:
    target_unit: records
    KB_Member: 100
    True_Non_Member: 100
    Spoof_Seed: 100
    Reserve: 100
    per_source_cap: 3
  formal:
    target_unit: sources
    KB_Member: 500
    True_Non_Member: 500
    Spoof_Seed: 0
    Reserve: 250
    per_source_cap: null

eligibility_scan:
  protocol: v6_3_precision_cascade_fixed_double_pool_v3
  release_protocol: v6_3_attack_first_rc2_budget6_release_v1
  selection_seed: 42
  wave_size: 250
  candidate_pool_multiplier: 2
  candidate_pool_target_sources: 2500
  candidate_pool_shortfall_policy: use_complete_source_universe
  scan_full_candidate_pool: true
  target_query_eligible_sources: 1250
  required_formal_sources: 1250
  max_chunks_per_source: 5
  fallback_chunk_caps: [8, 12]
  minimum_valid_claims: 3
  minimum_stealth_pairs: 3
  deduplicate_complete_sources: true

datasets:
  edgar:
    input_path: datasets/raw/extracted/edgar/raw.jsonl
    limit: null
    source_limit: 1600
    source_eligibility_path: artifacts/v6_3/budget6_release_inputs_attack_first_rc2/edgar/edgar_query_eligible_sources.json
    membership_unit: filing
  enron:
    input_path: datasets/raw/extracted/enron
    limit: 30000
    source_eligibility_path: artifacts/v6_3/budget6_release_inputs_attack_first_rc2/enron/enron_query_eligible_sources.json
    membership_unit: complete_email
  pubmed:
    input_path: datasets/raw/extracted/pmc/raw.jsonl
    limit: 50000
    source_eligibility_path: artifacts/v6_3/budget6_release_inputs_attack_first_rc2/pubmed/pubmed_query_eligible_sources.json
    membership_unit: pmcid_article
