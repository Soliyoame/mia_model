# RAG 索引与生成配置文件（对应流水线第 03 步建索引、第 10 步跑 RAG/LLM-only 推理）。
# 作用：告诉程序「用什么向量模型建库、怎么检索、调哪个大模型、超时重试怎么设」。

# ---------------- 日志 ----------------
logging:
  level: INFO                      # 日志详细程度：INFO=常规；排错可改 DEBUG
  file: artifacts/v21/logs/rag.log

# 大模型 profile 定义文件（接口风格、system prompt、默认模型名都在这里）。
# 真实 key/base_url/model 仍由 .env 的 PCV_VICTIM_* / PCV_SIBLING_* 覆盖。
llm_profiles_path: configs/llm_profiles.yaml
generator_registry_path: configs/generator_families_v21.yaml
generator_family: gemma

experiment_protocol:
  protocol_version: pcv-mia-v21
  method_version: pcv-rag-only-source-v21
  dataset_status: rebuild_pending
  metrics_version: source-bootstrap-low-fpr-v21
  reserve_role: retriever_dev_and_conformal
  conformal_source_count: 245
  conformal_alphas: [0.005, 0.01, 0.05]
  execution: source_block_interleaved
  pairs_per_source: 3
  logical_victim_calls_per_source_per_mode: 6
  dense_retriever_model: BAAI/bge-base-en-v1.5

# ---------------- 输入/输出目录 ----------------
paths:
  query_controls_dir: artifacts/v6_3/query_controls
  query_control_responses_dir: artifacts/v6_3/query_control_responses
  splits_dir: artifacts/v6_3/splits                     # 读：v6.3 source-level split
  indexes_dir: artifacts/v20/indexes                     # 写：v20 正式 KB_Member 索引
  retrieval_dev_indexes_dir: artifacts/v20/retrieval_dev_indexes # Reserve-only pseudo-member 门禁，绝不进入正式 indexes
  benchmark_dir: artifacts/v6_3/benchmarks               # 读：v6.3 固化 benchmark（带 hash）
  queries_dir: artifacts/v6_3/stealth_filtered_queries   # 读：v6.3 第 09 步固定预算查询
  rag_responses_dir: artifacts/v20/rag_responses
  llm_only_responses_dir: artifacts/v20/llm_only_responses
  scores_dir: artifacts/v20/scores
  reports_dir: artifacts/v20/reports
  runs_dir: artifacts/v20/runs
  pilots_dir: artifacts/v20/pilots
  release_controls_dir: artifacts/v20/release_controls
  reserve_roles_dir: artifacts/v20/release_controls/reserve_roles
  ground_truth_source_store_dir: artifacts/v20/release_controls/ground_truth_source_store
  execution_schedule_path: artifacts/v20/release_controls/execution_schedule.jsonl
  execution_schedule_manifest_path: artifacts/v20/release_controls/execution_schedule.manifest.json
  generator_registry_state_dir: artifacts/v20/generator_registry_state
  facts_dir: artifacts/v6_3/facts

# ---------------- 向量嵌入（把文本转成向量，用于检索）----------------
dataset_paths:
  edgar:
    splits_dir: artifacts/v6_3/splits/edgar
  enron:
    splits_dir: artifacts/v6_3/splits/enron
  pubmed:
    splits_dir: artifacts/v6_3/splits/pubmed

embedding:
  model: BAAI/bge-base-en-v1.5
  # 首次下载并验证后应替换为 Hugging Face commit SHA；canonical 门禁拒绝模糊 snapshot。
  revision: a5beb1e3e68b9ab74eb54cfd186867f64f240e1a
  backend: auto                                   # auto/sentence_transformers=用真实模型；
                                                  # 写 hashing 会直接报错（已禁用假 fallback）
  local_files_only: true                          # 正式实验只使用已冻结的本地模型 snapshot
  dim: 768
  query_instruction: "Represent this sentence for searching relevant passages: "

# ---------------- 分块（建索引时把文档再切成检索单元）----------------
chunking:
  unit: tokens
  tokenizer_model: BAAI/bge-base-en-v1.5
  tokenizer_revision: a5beb1e3e68b9ab74eb54cfd186867f64f240e1a
  tokenizer_local_files_only: true
  chunk_size: 128
  chunk_overlap: 32
  offline_gate_candidates:
    - {chunk_size: 128, chunk_overlap: 32}
    - {chunk_size: 256, chunk_overlap: 32}
    - {chunk_size: 384, chunk_overlap: 64}

# ---------------- 检索（回答问题前先从库里找相关块）----------------
retrieval:
  backend: dense
  top_k: 5
  query_rewriting: false # 是否先把问题改写再检索：false=直接用原问题检索（保持攻击查询原样）
  retriever_ids:
    dense: BAAI/bge-base-en-v1.5
    bm25: bm25
    hybrid: bge-base-en-v1.5+bm25+rrf+bge-reranker-base
    none: none
  hybrid:
    dense_candidate_top_k: 20
    bm25_candidate_top_k: 20
    rrf_k: 60
    fusion_top_k: 20
    reranker_model: BAAI/bge-reranker-base
    reranker_revision: 2cfc18c9415c912f9d8155881c133215df768a70
    reranker_local_files_only: true
    final_top_k: 5
  offline_gate:
    recall_at_5_min: 0.70
    recall_at_10_min: 0.80
    zero_hit_source_rate_max: 0.05
    forbidden_group_overlap: 0
    fallback_dense_model: BAAI/bge-large-en-v1.5
    fallback_chunk_size: 256
    fallback_chunk_overlap: 32
  context_controls:
    oracle_max_chunks: 5
    random_token_tolerance: 0.05
    minhash_jaccard_exclusion: 0.85
    dense_cosine_exclusion: 0.85

# ---------------- 生成（第 10 步调 victim 大模型回答问题）----------------
generation:
  run_llm_only: false             # 默认只跑 RAG；论文归因/阴性对照实验时显式开启
  victim_profile: gemma2_2b_primary
  temperature: 0.0                # 采样温度：0=确定性输出（注：实测 qwen3.5-flash temp=0 仍有~15%不复现）
  max_tokens: 512                 # 单次回答最多生成 512 token
  timeout: 60                     # 单次请求超时 60 秒（从 120 下调：撞卡顿时快速失败，别干耗）
  retries: 2                      # 失败后最多重试 2 次（从 4 下调：并发下卡顿由别的线程补，不必久等）
  retry_backoff_base: 30          # 重试等待基数（秒）：第 1 次等 ~30s，逐次指数退避
  retry_backoff_max: 300          # 重试等待上限：单次最多等 300 秒
  # 短指数退避耗尽后,API/网络错误不丢弃:长冷却后重试同一请求,直到成功。
  retry_until_success: true
  retry_cooldown_seconds: 300     # 每轮短重试耗尽后冷却 5 分钟
  request_interval_seconds: 20    # 【仅在 requests_per_minute=0 时生效】每两次请求固定间隔（旧限速方式）
  # === 抗卡顿限速（令牌桶 + 并发）===
  # requests_per_minute > 0 时启用【全局令牌桶】：全局速率恒 ≤ 此 RPM（绝不超端点限流），
  # 但配合 max_workers>1，某条 call 卡住时别的线程仍能发满 RPM —— 把管道填满、抗端点间歇卡顿。
  # 并发【不是】为了超过 RPM，是为了在抖动下【仍能达到】RPM。实测卡顿会把每条均摊到 ~72–96s，
  # 而 4 RPM 理论只该 15s/条，本机制目标是把实际耗时拉回接近理论地板（潜在 ~4–5×）。
  # ⚠️ 必须设成你 key 的真实 RPM 上限（这里=4）。设 0 则回退到 request_interval_seconds 旧方式。
  requests_per_minute: 0          # local Hugging Face victim，不使用 API 令牌桶
  # sibling(attacker)是【另一把 key、另一个端点】→ 给它【单独一只令牌桶】按自己的 RPM 放行,
  # 不跟 victim 抢速率(仅 --attacker sibling 生效;--attacker victim 时两路合用 victim 桶)。
  # 0 或不填 = 回退成与 victim 同 RPM。
  sibling_requests_per_minute: 4  # sibling key(windhub 等)的每分钟请求上限
  max_workers: 1                  # Gemma 本地 BF16，冻结 batch_size=1
