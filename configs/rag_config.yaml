# RAG index and generation configuration.

logging:
  level: INFO
  file: datasets/logs/rag.log

llm_profiles_path: configs/llm_profiles.yaml

paths:
  splits_dir: datasets/splits
  indexes_dir: indexes
  benchmark_dir: datasets/benchmarks
  queries_dir: outputs/stealth_filtered_queries
  rag_responses_dir: outputs/rag_responses
  llm_only_responses_dir: outputs/llm_only_responses

embedding:
  # 正式实验可改为 bge-small-en、all-MiniLM-L6-v2、bge-base-en、e5-base-v2、gte 等。
  model: sentence-transformers/all-MiniLM-L6-v2
  backend: auto
  dim: 384

chunking:
  chunk_size: 500
  chunk_overlap: 50

retrieval:
  top_k: 5
  query_rewriting: false

generation:
  victim_profile: null
  temperature: 0.0
  max_tokens: 512
  timeout: 60
  retries: 2
  retry_backoff_base: 5
  retry_backoff_max: 120
  request_interval_seconds: 1
  # 并发 LLM 请求数：1 = 串行（默认，行为与原来完全一致）。
  # 确认 victim API 的限流额度后可调高（如 4~8）以显著缩短墙钟时间。
  max_workers: 1
