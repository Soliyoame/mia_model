    per_pair_victim_or_llm_output_used: false
    required_response_fields: [stance, correction_entity]
    stance_values: [supported, contradicted, insufficient]
    exact_correction_entity_required_when_contradicted: true
    unknown_fields_mark_schema_invalid: true
    non_contradicted_correction_entity_must_be_null: true

selection:
  strategy: hard_gates_then_deterministic_lexicographic_ranking
  learned_or_weighted_utility_score_used: false
  all_numeric_rank_features_are_recomputed_by_validator: true
  ranking_tuple_ascending:
    - negative_relation_cue_count
    - sentence_source_occurrence_count
    - negative_terminal_declarative_flag
    - negative_min_content_token_count_40
    - normalized_original_entity_bounded_occurrence_count
    - same_type_filler_inventory_count
    - negative_source_specific_anchor_count
    - negative_idf_sum_rounded_12
    - negative_distinct_content_token_count
    - competing_relation_signature_count
    - correction_candidate_count
    - negative_explicit_argument_count
    - unresolved_reference_count
    - fact_signature_asc
    - original_span_start_asc
    - counterfactual_entity_normalized_asc
    - pair_id_asc
  rank_feature_definitions:
    relation_cue_count: non_overlapping_relation_cue_regex_match_count_in_supporting_sentence
    sentence_source_occurrence_count: non_overlapping_literal_occurrence_count_of_unmodified_trimmed_supporting_sentence_in_complete_source
    terminal_declarative_flag: 1_if_supporting_sentence_ends_with_period_or_semicolon_else_0
    min_content_token_count_40: min_40_and_distinct_non_entity_non_stopword_content_token_count
    normalized_original_entity_bounded_occurrence_count: bounded_value_occurrence_count_in_complete_source
    same_type_filler_inventory_count: distinct_normalized_fillers_with_effective_type_in_complete_source
    source_specific_anchor_count: distinct_anchor_tokens_passing_df_times_100_less_than_or_equal_to_N
    idf_sum_rounded_12: sum_idf_over_distinct_anchor_tokens_then_round_half_even_to_12_decimal_places
    distinct_content_token_count: distinct_tokens_after_all_anchor_removal_and_tokenization_rules
    competing_relation_signature_count: distinct_non_original_same_type_fillers_whose_relation_signature_equals_target_relation_signature
    correction_candidate_count: distinct_fillers_for_target_relation_signature
    explicit_argument_count: distinct_non_stopword_tokens_before_first_relation_cue_plus_distinct_non_stopword_tokens_after_ENTITY_SLOT
    unresolved_reference_count: non_overlapping_unresolved_reference_regex_match_count
    negative_prefix: multiply_numeric_feature_by_negative_one
    asc_suffix: compare_normalized_utf8_strings_in_python_lexicographic_order
  diversity_constraints:
    distinct_fact_signatures: true
    maximum_pairs_per_original_entity: 2
    type_quota: null
  tie_breaking: deterministic_no_random_draw_after_protocol_freeze
  selection_algorithm:
    name: stable_greedy_top_3_v1
    procedure: sort_all_hard_gate_passed_formal_type_pairs_by_ranking_tuple_then_scan_once_accept_if_fact_signature_unseen_and_normalized_original_entity_count_below_2_stop_at_3
    eligible_source_definition: stable_greedy_returns_exactly_3_pairs
    fewer_than_3_policy: source_ineligible_and_no_p0_pairs_emitted
    output_order: accepted_greedy_order
  canonical_pair_artifact:
    development_path_pattern: artifacts/v23/selection/development/<dataset>/selected_pairs.jsonl
    fresh_audit_path_pattern: artifacts/v23/selection/fresh_audit/<protocol_revision_id>/<dataset>/selected_pairs.jsonl
    formal_path_pattern: artifacts/v23/selection/formal/<protocol_revision_id>/<dataset>/selected_pairs.jsonl
    serialization: one_selector_primitives_canonical_json_object_per_utf8_line_with_single_lf_terminator
    order: frozen_source_order_then_accepted_greedy_pair_order
    row_schema: {kind: str, specification_version: str, protocol_revision_id: lowercase_sha256_hex, dataset: str, source_key: str, source_hash: lowercase_sha256_hex, normalized_text_hash: lowercase_sha256_hex, source_order_rank: int, pair_order: int, pair_id: lowercase_sha256_hex, fact_signature: lowercase_sha256_hex, relation_signature: lowercase_sha256_hex, supporting_sentence: str, original_span: list_of_exactly_two_ints, original_entity: str, counterfactual_entity: str, effective_type: str, semantic_subtype: str, true_claim: str, counterfactual_claim: str, rank_tuple: list_of_exactly_17_values}
    constants: {kind: v23_selected_pair}
    unknown_fields: reject
    file_sha256: sha256_of_complete_file_bytes

development_gate:
  source_count_per_dataset: 1000
  source_set: exact_v22_development_sources_fresh_reextracted_from_bound_v22_source_database
  labels_or_thresholds_from_v22_used: false
  expected_pair_count_per_eligible_source: 3
  gates:
    deterministic_rerun_hash_match: true
    cross_dataset_source_and_text_hash_overlap: 0
    development_formal_source_overlap: 0
    hard_gate_violation_rate: 0.0
    exact_three_pair_rate_among_eligible_sources: 1.0
    capacity_inference:
      distribution: hypergeometric_without_replacement
      confidence_side: one_sided_lower
      alpha: 0.05
      population_N: exact_bound_source_count
      sample_n: 1000
      observed_x: eligible_source_count_in_development
      total_eligible_lower_K_L: minimum_integer_K_in_0_to_N_such_that_hypergeom_survival_x_minus_1_given_N_K_n_is_at_least_0_05
      consumed_non_development_c: count_distinct_ledger_sources_excluding_development_in_same_dataset
      formal_eligible_lower: max_0_K_L_minus_observed_x_minus_consumed_non_development_c
      comparison: formal_eligible_lower_greater_than_or_equal_to_2250
      initial_c: 250
      initial_minimum_observed_x:
        edgar: 623
        enron: 89
        pubmed: 66
      initial_boundary_check:
        edgar: {x: 623, K_L: 3125, formal_eligible_lower: 2252}
        enron: {x: 89, K_L: 2618, formal_eligible_lower: 2279}
        pubmed: {x: 66, K_L: 2574, formal_eligible_lower: 2258}
      recompute_before_each_new_revision_may_enter_fresh_audit_or_formal_scan: true
  failure_policy: new_protocol_revision_required_no_formal_scan

