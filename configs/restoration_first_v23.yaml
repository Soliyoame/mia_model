selector_primitives:
  text_normalization:
    name: unicode_nfkc_casefold_whitespace_v1
    algorithm: apply_unicode_nfkc_then_python_str_casefold_then_replace_each_maximal_unicode_isspace_run_with_one_ascii_space_then_strip
    empty_value_rejected: true
  coordinates:
    unit: python_unicode_codepoint
    interval: half_open
    original_span_reference: unmodified_supporting_sentence
    substring_invariant: supporting_sentence_start_end_equals_original_entity_exactly
  canonical_json:
    encoding: utf_8
    ensure_ascii: false
    sort_keys: true
    separators: [",", ":"]
    allow_nan: false
    trailing_newline: false
  hash:
    algorithm: sha256
    input: canonical_json_utf8_unless_raw_text_hash_is_explicitly_named
    output: lowercase_hex
  raw_text_hashes:
    source_hash: sha256_utf8_of_sources_full_text_exact_bytes_as_python_string
    chunk_hash: sha256_utf8_of_row_json_text_exact_bytes_as_python_string
    sentence_hash: sha256_utf8_of_unmodified_trimmed_supporting_sentence
  normalized_text_hash: sha256_utf8_of_unicode_nfkc_casefold_whitespace_v1_text
  bounded_value_occurrence:
    comparison_text: unicode_nfkc_casefold_whitespace_v1
    match: literal_normalized_value_substring
    left_boundary: start_of_text_or_previous_codepoint_is_not_unicode_alphanumeric
    right_boundary: end_of_text_or_next_codepoint_is_not_unicode_alphanumeric
  proposition_segmentation:
    input: sources_full_text
    raw_regex: '[^.!?\n]+(?:[.!?]+|$)'
    row_boundary: newline_is_always_a_boundary
    trimming: remove_leading_and_trailing_unicode_whitespace_and_rebase_coordinates
    empty_segments_removed: true
  tokenization:
    after_normalization_regex: "[a-z0-9]+(?:[-'][a-z0-9]+)*"
    minimum_token_characters: 3
    pure_numeric_tokens_removed: true
    stopwords: [a, an, and, are, as, at, be, been, being, but, by, can, could, did, do, does, for, from, had, has, have, he, her, here, him, his, how, i, if, in, into, is, it, its, may, might, more, most, no, not, of, on, or, our, shall, she, should, than, that, the, their, them, then, there, these, they, this, those, to, was, we, were, what, when, where, which, who, why, will, with, would, you, your]
  deterministic_regexes:
    flags: python_re_ignorecase_and_unicode
    relation_cue: '\b(?:is|are|was|were|be|been|being|has|have|had|will|would|shall|should|can|could|received|paid|sent|met|meet|discussed|signed|reported|increased|decreased|acquired|sold|filed|approved|required|requires|expires|begins|ends|contains|assigned|located|treated|measured|observed|compared)\b'
    mail_header: '^\s*(?:from|to|cc|bcc|subject|sent|date|message-id|content-type)\s*:'
    unresolved_reference: '\b(?:this|that|these|those|here|there|above|below|aforementioned|former|latter|he|she|it|they)\b'
    generic_role_fullmatch: '^(?:president|director|manager|officer|author|employee|customer|company|department|team|group|system|service|product|agreement)$'
    balanced_delimiters: require_equal_well_nested_round_square_and_curly_delimiters_before_and_after_substitution
  identity_construction:
    relation_signature:
      object_schema: {kind: str, dataset: str, source_key: str, effective_type: str, masked_sentence_normalized: str}
      constants: {kind: v23_relation_signature}
      value: sha256_canonical_json_object
    fact_signature:
      object_schema: {kind: str, dataset: str, source_key: str, sentence_hash: lowercase_sha256_hex}
      constants: {kind: v23_fact_signature}
      value: sha256_canonical_json_object
    counterfactual_id:
      object_schema: {kind: str, specification_version: str, dataset: str, source_key: str, sentence_hash: lowercase_sha256_hex, original_span: list_of_exactly_two_ints, effective_type: str, semantic_subtype: str, counterfactual_normalized: str}
      constants: {kind: v23_counterfactual}
      value: sha256_canonical_json_object
    pair_id:
      object_schema: {kind: str, specification_version: str, fact_signature: lowercase_sha256_hex, original_entity_normalized: str, counterfactual_normalized: str, counterfactual_id: lowercase_sha256_hex}
      constants: {kind: v23_pair}
      value: sha256_canonical_json_object
  golden_vectors:
    normalization:
      input: "  Cafe\u0301\tACME  "
      expected: "caf\u00e9 acme"
      expected_codepoints_hex: ["0x63", "0x61", "0x66", "0xe9", "0x20", "0x61", "0x63", "0x6d", "0x65"]
    span:
      sentence: "Alice signed the Agreement."
      original_entity: Alice
      original_span: [0, 5]
      expected_substring: Alice
    canonical_json:
      object: {kind: v23_fact_signature, dataset: edgar, source_key: source-1, sentence_hash: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa}
      expected_utf8_text: '{"dataset":"edgar","kind":"v23_fact_signature","sentence_hash":"aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa","source_key":"source-1"}'
      expected_sha256: 5cb640436a1aaf6aa1f07e20aaba9e3f7f4fa9f3f3c43f42044beb0b0264e74b

