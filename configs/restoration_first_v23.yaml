protocol_version: pcv-mia-v23
method_version: pcv-restoration-first-v23
specification_version: pcv-restoration-first-v23-design-r6
status: design_preregistered_runtime_not_implemented
artifact_root: artifacts/v23
selection_seed: 42

research_objective:
  primary_attack: source_level_rag_only_paired_entity_restoration
  unit_of_evaluation: source_document
  construction_unit: entity_slot_pair
  estimand: attack_performance_conditional_on_preregistered_selector_eligibility
  mandatory_companion_reporting: [frozen_pool_coverage, eligible_source_rate, rejection_reasons, per_dataset_results, macro_results]
  transductive_unlabelled_full_pool_statistics_allowed: [document_frequency]
  transductive_statistics_disclosure_required: true
  counterfactual_naturalness_optimized: false
  luna_generation_first_cancelled: true
  matched_llm_only_role: frozen_post_selection_mechanism_control_only

threat_model:
  attacker_goal: infer_whether_a_known_candidate_source_document_is_in_the_target_rag_knowledge_base
  membership_unit: source_document
  attacker_prior_knowledge:
    - exact_candidate_source_text
    - exact_original_fact_and_original_entity_derived_without_membership_or_downstream_outputs
    - public_protocol_selector_and_query_schema
    - target_rag_query_interface
  attacker_unknowns:
    - membership_assignment
    - formal_split_key_order_before_release
    - main_index_contents_except_public_protocol_constraints
    - retriever_results_scores_and_ranks
    - victim_internal_states_and_model_logits
  attacker_access:
    interface: black_box_text_query_to_fixed_rag_pipeline
    visible_output: final_victim_response_body_or_transport_error_only
    retriever_api_or_metadata_visible: false
    index_inspection_or_write_access: false
    adaptive_queries_allowed: false
    rag_query_budget_per_selected_source_per_backend_cell: 6
    rag_backend_cells: [dense, bm25, hybrid]
    matched_llm_only_query_budget_per_selected_source_shared_cell: 6
    matched_llm_only_shared_across_all_rag_backends: true
    query_budget_may_increase_after_observing_responses: false
  selection_knowledge_boundary:
    membership_split_victim_llm_only_retriever_and_auc_visible: false
    full_candidate_source_visible: true
    transductive_aggregate_document_frequency_visible: true
  primary_observation: six_frozen_rag_response_cells_per_backend_for_three_frozen_pairs
  estimand_scope: conditional_on_selector_eligible_sources_not_all_documents

