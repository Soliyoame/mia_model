formal_sequence:
  stages:
    - runtime_implementation_and_tests
    - runtime_bundle_and_commit_freeze
    - aggregate_df_precomputation
    - revision_audit_reserve_snapshot_and_write_ahead_registration
    - development_pilot_and_capacity_gate
    - fresh_blind_audit
    - formal_source_scan
    - source_exclusive_split
    - reserve_only_shadow_gate
    - release_finalize
    - luna_query_generation
    - main_index_build_and_retriever_matrix
    - matched_rag_and_llm_only_victim_runs
    - parsing_scoring_and_source_level_evaluation
  stage_may_start_only_after_previous_passed: true
  formal_scan_early_stop_at_exact_target: true
  global_dataset_order: [edgar, enron, pubmed]
  dataset_execution: finish_one_dataset_before_starting_next_no_interleaving
  formal_scan_order_definition: at_formal_scan_start_freeze_current_valid_ledger_tip_and_scan_frozen_v22_source_order_ascending_after_excluding_every_source_in_that_prior_consumption_snapshot
  formal_scan_reservation_unit: exactly_one_source_per_reservation_batch
  formal_scan_loop: for_each_dataset_in_global_order_reserve_exactly_next_one_unexcluded_source_durably_then_read_and_evaluate_it_if_eligible_append_its_exact_three_pairs_stop_immediately_when_eligible_count_becomes_2250
  after_2250th_eligible: do_not_reserve_register_read_or_evaluate_any_later_source_in_same_dataset
  formal_scan_current_revision_rows: each_single_source_append_before_selector_read_and_remain_eligible_for_current_selected_set_but_are_excluded_from_every_future_revision

