# PCV-MIA 投稿主实验预注册。正式结果只能从本文件声明的实验单元中选择，
# 且选择规则与指标高低无关：取第一个通过全部 canonical 门禁的完整 run。
suite_id: pcv-mia-paper-v1
status: preregistered
selection_rule: first_preregistered_run_passing_all_gates
release_commit: null

protocol:
  method_version: pcv-rag-only-source-v19
  threat_model_version: strict-blackbox-v1
  metrics_version: source-conformal-v1
  scale: formal
  seed: 42
  main_score: pair mean within chunk, then equal chunk mean within source
  main_run_llm_only: false
  datasets: [edgar, enron, pubmed]
  generators: [qwen/qwen3.5-397b-a17b, gemini-2.0-flash, gpt-4.1-mini, meta-llama/llama-3.3-70b-instruct]
  retrievers: [dense, bm25]
  dense_retriever_model: sentence-transformers/all-MiniLM-L6-v2
  pairs_per_source: 3
  queries_per_source_per_cell: 6
  execution: one_cell_at_a_time
  baseline_method_policy:
    full_generator: qwen/qwen3.5-397b-a17b
    full_methods: [RAG-MIA, S2MIA, MBA, IA, DCMI]
    extension_methods: [IA, DCMI]
  defense_representative_cells:
    - {dataset: edgar, victim_model: qwen/qwen3.5-397b-a17b, retriever_backend: dense}
    - {dataset: enron, victim_model: qwen/qwen3.5-397b-a17b, retriever_backend: dense}
    - {dataset: pubmed, victim_model: qwen/qwen3.5-397b-a17b, retriever_backend: dense}

