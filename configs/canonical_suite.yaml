# PCV-MIA 投稿主实验预注册。正式结果只能从本文件声明的实验单元中选择，
# 且选择规则与指标高低无关：取第一个通过全部 canonical 门禁的完整 run。
suite_id: pcv-mia-paper-v1
status: preregistered
selection_rule: first_preregistered_run_passing_all_gates
release_commit: null

protocol:
  method_version: pcv-rag-only-source-v1
  threat_model_version: strict-blackbox-v1
  metrics_version: source-conformal-v1
  scale: formal
  seed: 42
  main_score: pair mean within chunk, then equal chunk mean within source
  main_run_llm_only: false

cells:
  - dataset: edgar
    run_role: main
    victim_model: qwen/qwen3.5-397b-a17b
    scale: formal
    seed: 42
  - dataset: edgar
    run_role: matched_control
    victim_model: qwen/qwen3.5-397b-a17b
    scale: formal
    seed: 42
  - dataset: enron
    run_role: main
    victim_model: qwen/qwen3.5-397b-a17b
    scale: formal
    seed: 42
  - dataset: enron
    run_role: matched_control
    victim_model: qwen/qwen3.5-397b-a17b
    scale: formal
    seed: 42
